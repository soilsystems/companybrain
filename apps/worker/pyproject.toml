[project]
name = "companybrain-worker"
version = "0.1.0"
description = "Dramatiq worker foundation for Company Brain"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dramatiq[redis]>=1.17.0",
  "pydantic-settings>=2.5.2",
  "structlog>=24.4.0"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.3",
  "ruff>=0.6.8",
  "black>=24.8.0",
  "mypy>=1.11.2"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
