[project]
name = "companybrain-api"
version = "0.1.0"
description = "FastAPI foundation for Company Brain"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "openpyxl>=3.1.5",
  "pillow>=11.0.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "email-validator>=2.2.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "pyjwt[crypto]>=2.9.0",
  "python-json-logger>=2.0.7",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.8"
]

[tool.uv]
dev-dependencies = [
  "black>=24.8.0",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.8"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/services/auth.py" = ["B008"]
