name: frontend

on:
  pull_request:
  push:
    branches: [main, chore/full-code-foundation]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @companybrain/web lint
      - run: pnpm --filter @companybrain/web typecheck
      - run: pnpm --filter @companybrain/web test
      - run: pnpm --filter @companybrain/web build
